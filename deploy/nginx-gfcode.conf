# /etc/nginx/sites-available/gfcode.com.br
# Site estático da GF Code. HTTPS via certbot (o bloco 443 é ajustado pelo certbot --nginx).

server {
    listen 80;
    listen [::]:80;
    server_name gfcode.com.br www.gfcode.com.br;

    root /var/www/gfcode.com.br;
    index index.html;

    # www -> raiz
    if ($host = www.gfcode.com.br) {
        return 301 https://gfcode.com.br$request_uri;
    }

    # URLs limpas: /termos e /termos/ servem termos/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /termos { return 301 /termos/; }
    location = /privacidade { return 301 /privacidade/; }

    # Arquivos de SEO/GEO como texto
    location ~* ^/(robots|llms|llms-full|humans)\.txt$ {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /.well-known/security.txt { default_type text/plain; charset utf-8; }
    location = /sitemap.xml { default_type application/xml; charset utf-8; }
    location = /site.webmanifest { default_type application/manifest+json; }

    # Cache de estáticos
    location ~* \.(css|png|svg|ico|webp|jpg|jpeg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    error_page 404 /404.html;

    # Segurança básica
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    charset utf-8;
    gzip on;
    gzip_types text/plain text/css application/xml application/json image/svg+xml application/manifest+json;
}
