<style>
  :root{--bg:#12202f;--card:#1b2e44;--line:#2a4058;--txt:#ecf4fa;--mut:#a0b6c8;--cy:#06e5f8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:16px/1.5 Inter,system-ui,sans-serif;min-height:100vh;
    background-image:radial-gradient(80% 50% at 50% 0%,#06e5f81a,transparent 70%)}
  main{max-width:520px;margin:0 auto;padding:48px 16px 40px;text-align:center}
  .logo{width:104px;height:104px;border-radius:50%;border:3px solid var(--cy);object-fit:cover;background:#0b1520}
  h1{font-size:26px;margin:16px 0 4px;letter-spacing:-.3px}
  .bio{color:var(--mut);margin-bottom:28px}
  nav{display:flex;flex-direction:column;gap:12px}
  a.btn{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:14px;background:var(--card);
    border:1px solid var(--line);color:var(--txt);text-decoration:none;font-weight:600;transition:border-color .15s,transform .15s}
  a.btn:hover,a.btn:focus-visible{border-color:var(--cy);transform:translateY(-1px);outline:none}
  a.btn.pri{background:var(--cy);color:#04121c;border-color:var(--cy)}
  a.btn svg{width:22px;height:22px;flex:none}
  a.btn span{flex:1;text-align:left}
  a.btn small{font-weight:400;opacity:.75}
  footer{margin-top:32px;color:var(--mut);font-size:13px}
  footer a{color:var(--mut)}
</style>
